name: Firmware

on:
  push:
    branches:
      - "main"
    tags:
      - "*"
  pull_request:
    paths:
      - "Firmware/**"
      - ".github/workflows/firmware_workflow.yml"

env:
  FLASH_TOTAL_KB: 2048
  RAM_TOTAL_KB: 264

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            python3 \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Configure
        run: cmake -S Firmware -B Firmware/build

      - name: Build
        run: cmake --build Firmware/build -j"$(nproc)"

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: rack_distribution-uf2
          path: Firmware/build/rack_distribution.uf2
          if-no-files-found: error
